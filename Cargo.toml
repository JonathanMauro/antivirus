[workspace]
resolver = "2"
members = ["crates/tkv-core", "crates/tkv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["THUGAS KILL VIRUS"]

[workspace.dependencies]
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
