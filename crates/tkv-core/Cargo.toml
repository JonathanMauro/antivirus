[package]
name = "tkv-core"
description = "Núcleo do THUGAS KILL VIRUS: hashing, assinaturas, heurística e scanner."
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
sha2.workspace = true
hex.workspace = true
walkdir.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
goblin.workspace = true
yara-x = { workspace = true, optional = true }

[features]
default = ["yara"]
# Motor YARA (yara-x). Desative com --no-default-features para um build mínimo.
yara = ["dep:yara-x"]

[dev-dependencies]
tempfile.workspace = true
